name: test

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src
      - run: python -m acis.cli validate --recordings data/examples/recordings.jsonl --annotations data/examples/annotations.jsonl
      - run: python -m acis.cli evaluate --recordings data/examples/recordings.jsonl --annotations data/examples/annotations.jsonl --output /tmp/acis-report.md --allow-synthetic
